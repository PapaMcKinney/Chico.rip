<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#161b19">
  <meta name="description" content="In Loving Memory of Chico the Cat — a collection of treasured photographs and music.">
  <title>Chico the Cat · In Loving Memory</title>
  <link rel="preload" as="image" href="IMG_3714.JPEG">
  <style>
:root{color-scheme:dark;--bg:#161b19;--white:#f7f2e9;--muted:#b4bab3;--gold:#d7ab78;--border:rgba(236,221,203,.16);--surface:#222a26;--serif:Georgia,'Times New Roman',serif}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;min-height:100vh;background:radial-gradient(ellipse 75% 40% at 50% 30%,#2c382f 0,transparent 76%),var(--bg);color:var(--white);font:16px/1.6 system-ui,-apple-system,'Segoe UI',sans-serif;overflow-x:hidden}
button,a{-webkit-tap-highlight-color:transparent}
button{font:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:4px}
.ambient{position:fixed;width:min(600px,80vw);height:650px;filter:blur(95px);opacity:.13;pointer-events:none;z-index:0}
.ambient-a{top:0;left:-280px;background:#9f754c}.ambient-b{right:-300px;bottom:-200px;background:#39644d}
.page-shell{position:relative;z-index:1;min-height:100vh;display:flex;flex-direction:column}
.topbar{width:min(1100px,calc(100% - 48px));margin:0 auto;padding:26px 0;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.wordmark{color:var(--white);text-decoration:none;font-family:var(--serif);font-weight:600;font-size:23px;letter-spacing:-.03em}.small-star{color:var(--gold);font-family:system-ui;font-size:17px;margin-right:9px}
.topbar-detail{font-size:11px;letter-spacing:.19em;text-transform:uppercase;color:#a3afa6}
.memorial{width:min(1000px,calc(100% - 40px));margin:0 auto;flex:1;padding:58px 0 58px}
.memorial-heading{text-align:center;margin-bottom:38px}
.eyebrow{display:block;color:var(--gold);font-size:11px;letter-spacing:.28em;text-transform:uppercase;font-weight:700;margin-bottom:16px}
h1{font:normal clamp(36px,5.6vw,74px)/1.1 var(--serif);letter-spacing:-.04em;margin:0 auto;max-width:870px;text-wrap:balance}
.ornament{display:flex;gap:16px;align-items:center;justify-content:center;color:var(--gold);margin-top:23px;font-size:15px}
.ornament span{width:60px;height:1px;background:linear-gradient(90deg,transparent,rgba(215,171,120,.48))}.ornament span:last-child{transform:rotate(180deg)}
.gallery{width:min(820px,100%);margin:0 auto}
.image-stage{position:relative;display:flex;align-items:center;justify-content:center;isolation:isolate;overflow:hidden;min-height:350px;height:min(59vw,590px);max-height:68vh;padding:16px;background:linear-gradient(140deg,rgba(219,175,128,.13),rgba(17,23,19,.88) 40%,rgba(125,147,120,.08));border:1px solid rgba(215,171,120,.28);box-shadow:0 30px 80px rgba(0,0,0,.36),inset 0 0 0 8px rgba(0,0,0,.10);border-radius:14px}
.stage-glow{position:absolute;inset:15%;border-radius:50%;background:#d4aa79;filter:blur(110px);opacity:.09;z-index:-1;pointer-events:none}
.hero-photo{max-width:100%;max-height:100%;width:100%;height:100%;object-fit:contain;border-radius:5px;transition:opacity .32s ease;filter:drop-shadow(0 10px 16px rgba(0,0,0,.24))}
.hero-photo.is-changing{opacity:.12}
.gallery-nav{position:absolute;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:46px;height:46px;border-radius:50%;border:1px solid rgba(255,255,255,.35);color:white;background:rgba(17,21,18,.72);cursor:pointer;z-index:2}
.gallery-nav[hidden]{display:none}
.gallery-nav span{font-family:var(--serif);font-size:37px;line-height:.8;margin-top:-4px}
.gallery-nav:hover{background:rgba(26,31,27,.95)}.gallery-nav.prev{left:23px}.gallery-nav.next{right:23px}
.gallery-meta{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:18px 5px 0;color:#c7cbc5;font-family:var(--serif);font-size:17px}.caption{margin:0}.photo-counter{font:600 11px/1.4 system-ui,sans-serif;letter-spacing:.18em;color:#adbaae}
.gallery-dots{display:flex;justify-content:center;gap:10px;min-height:20px;margin-top:12px}.gallery-dots:empty{display:none}.gallery-dots button{width:9px;height:9px;padding:0;border-radius:50%;border:0;background:#6b7970;cursor:pointer}.gallery-dots button[aria-current="true"]{background:var(--gold);transform:scale(1.25)}
.music-card{display:flex;align-items:center;gap:16px;width:min(820px,100%);margin:35px auto 0;padding:18px 20px;background:rgba(240,229,211,.055);border:1px solid var(--border);border-radius:14px}
.music-mark{width:46px;height:46px;display:grid;place-items:center;flex-shrink:0;color:var(--gold);border-radius:50%;background:rgba(215,171,120,.13);font-size:24px}
.music-copy{display:flex;flex:1;min-width:0;flex-direction:column;gap:2px}.music-title{font-family:var(--serif);font-size:19px}.music-hint{font-size:12px;color:var(--muted);line-height:1.3}
.music-button{display:flex;align-items:center;gap:12px;justify-content:center;border:1px solid rgba(215,171,120,.46);background:#35453b;color:#fff4e4;padding:11px 17px;white-space:nowrap;border-radius:99px;cursor:pointer;font-size:13px;font-weight:650}
.music-button:hover{background:#425748}.music-icon{font-size:13px;color:#eac18c}
.footer{display:flex;gap:12px;align-items:center;justify-content:center;flex-wrap:wrap;border-top:1px solid var(--border);padding:25px 20px;color:#9aa59c;font-size:11px;letter-spacing:.08em}.footer-sep{color:#aa875f}
@media(max-width:650px){.topbar{width:calc(100% - 36px);padding:19px 0}.wordmark{font-size:21px}.topbar-detail{font-size:9px;letter-spacing:.11em}.memorial{width:calc(100% - 28px);padding:42px 0}.memorial-heading{margin-bottom:27px}.eyebrow{margin-bottom:12px}.ornament{margin-top:17px}.image-stage{height:min(70vh,590px);min-height:315px;max-height:70svh;padding:9px;border-radius:12px}.gallery-nav{width:40px;height:40px}.gallery-nav.prev{left:12px}.gallery-nav.next{right:12px}.gallery-meta{font-size:15px;padding:13px 3px 0}.music-card{gap:10px;padding:13px;margin-top:22px}.music-mark{width:39px;height:39px;font-size:19px}.music-title{font-size:17px}.music-button{padding:10px 12px;font-size:12px;gap:7px}.music-hint{font-size:11px}}
@media(max-width:370px){.topbar-detail{display:none}.music-mark{display:none}.music-card{gap:7px}}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}.hero-photo{transition:none}}

  </style>
</head>
<body>
  <div class="ambient ambient-a" aria-hidden="true"></div>
  <div class="ambient ambient-b" aria-hidden="true"></div>
  <div class="page-shell">
    <header class="topbar">
      <a class="wordmark" href="/" aria-label="Chico dot rip home"><span class="small-star" aria-hidden="true">✦</span> chico.rip</a>
      <span class="topbar-detail">a place to remember</span>
    </header>

    <main class="memorial" id="main">
      <section class="memorial-heading" aria-labelledby="tribute-title">
        <span class="eyebrow">Always remembered</span>
        <h1 id="tribute-title">In Loving Memory of Chico the Cat</h1>
        <div class="ornament" aria-hidden="true"><span></span>✦<span></span></div>
      </section>

      <section class="gallery" aria-label="Photos of Chico">
        <div class="image-stage" id="image-stage">
          <div class="stage-glow" aria-hidden="true"></div>
          <img id="hero-photo" class="hero-photo" src="IMG_3714.JPEG" alt="Chico the Cat" fetchpriority="high">
          <button class="gallery-nav prev" id="previous-photo" type="button" aria-label="Previous photo" hidden><span aria-hidden="true">‹</span></button>
          <button class="gallery-nav next" id="next-photo" type="button" aria-label="Next photo" hidden><span aria-hidden="true">›</span></button>
        </div>
        <div class="gallery-meta">
          <p id="photo-caption" class="caption">Chico the Cat</p>
          <span class="photo-counter" id="photo-counter" aria-live="polite">01 / 01</span>
        </div>
        <div id="gallery-dots" class="gallery-dots" aria-label="Choose a photograph"></div>
      </section>

      <section class="music-card" aria-label="Background music">
        <div class="music-mark" aria-hidden="true">♫</div>
        <div class="music-copy">
          <span class="music-title">Chico's music</span>
          <span class="music-hint" id="music-hint" aria-live="polite">The music can play on repeat.</span>
        </div>
        <button class="music-button" id="music-button" type="button" aria-label="Play Chico's music"><span id="music-button-label">Play music</span><span class="music-icon" id="music-button-icon" aria-hidden="true">▶</span></button>
        <audio id="memorial-audio" autoplay loop preload="metadata">
          <source src="[FREE] Sad Acoustic Guitar Type Beat _ Pop Instrumental _ _i luv u_ 0.mp3" type="audio/mpeg">
          Your browser does not support the audio element.
        </audio>
      </section>
    </main>

    <footer class="footer"><span>Chico.rip</span><span class="footer-sep" aria-hidden="true">✦</span><span>Always in our hearts</span></footer>
  </div>
  <script>
(() => {
  'use strict';
  const img = document.getElementById('hero-photo');
  const caption = document.getElementById('photo-caption');
  const counter = document.getElementById('photo-counter');
  const prev = document.getElementById('previous-photo');
  const next = document.getElementById('next-photo');
  const dots = document.getElementById('gallery-dots');
  const stage = document.getElementById('image-stage');
  const audio = document.getElementById('memorial-audio');
  const musicButton = document.getElementById('music-button');
  const musicLabel = document.getElementById('music-button-label');
  const musicIcon = document.getElementById('music-button-icon');
  const musicHint = document.getElementById('music-hint');
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  const defaultPhoto = { src: 'IMG_3714.JPEG', alt: 'Chico the Cat', caption: 'Chico the Cat' };
  let photos = [defaultPhoto];
  let currentIndex = 0;
  let slideTimer = null;
  let renderGeneration = 0;
  const slideshowDelay = 7000;

  const render = (immediate = false) => {
    const item = photos[currentIndex];
    const generation = ++renderGeneration;
    const swap = () => {
      if (generation !== renderGeneration) return;
      img.src = item.src;
      img.alt = item.alt || 'Chico the Cat';
      caption.textContent = item.caption || item.alt || 'Chico the Cat';
      counter.textContent = `${String(currentIndex + 1).padStart(2, '0')} / ${String(photos.length).padStart(2, '0')}`;
      Array.from(dots.children).forEach((button, i) => {
        button.setAttribute('aria-current', String(i === currentIndex));
      });
      img.classList.remove('is-changing');
    };
    if (immediate || prefersReducedMotion) swap();
    else { img.classList.add('is-changing'); window.setTimeout(swap, 210); }
  };

  const stopTimer = () => { if (slideTimer !== null) window.clearInterval(slideTimer); slideTimer = null; };
  const startTimer = () => {
    stopTimer();
    if (photos.length < 2 || document.hidden || prefersReducedMotion) return;
    slideTimer = window.setInterval(() => { currentIndex = (currentIndex + 1) % photos.length; render(); }, slideshowDelay);
  };
  const go = (delta) => {
    if (photos.length < 2) return;
    currentIndex = (currentIndex + delta + photos.length) % photos.length;
    render(); startTimer();
  };
  prev.addEventListener('click', () => go(-1));
  next.addEventListener('click', () => go(1));
  stage.addEventListener('mouseenter', stopTimer);
  stage.addEventListener('mouseleave', startTimer);
  stage.addEventListener('focusin', stopTimer);
  stage.addEventListener('focusout', () => window.setTimeout(() => { if (!stage.contains(document.activeElement)) startTimer(); }, 50));
  document.addEventListener('visibilitychange', () => document.hidden ? stopTimer() : startTimer());
  document.addEventListener('keydown', (e) => {
    if (e.target instanceof HTMLElement && /^(input|textarea|select)$/i.test(e.target.tagName)) return;
    if (e.key === 'ArrowLeft') go(-1);
    if (e.key === 'ArrowRight') go(1);
  });

  fetch('photos.json', { cache: 'no-cache' }).then(r => {
    if (!r.ok) throw new Error(`Cannot load photo list: ${r.status}`);
    return r.json();
  }).then(data => {
    if (!data || !Array.isArray(data.photos)) return;
    const validated = data.photos.filter(p => p && typeof p.src === 'string' && p.src.length && !/^(?:[a-z]+:)?\/\//i.test(p.src));
    if (!validated.length) return;
    photos = validated;
    currentIndex = 0;
    prev.hidden = next.hidden = photos.length < 2;
    dots.replaceChildren();
    if (photos.length > 1) {
      photos.forEach((item, i) => {
        const b = document.createElement('button'); b.type = 'button'; b.setAttribute('aria-label', `Show photo ${i + 1}`);
        b.addEventListener('click', () => { currentIndex = i; render(); startTimer(); });
        dots.appendChild(b);
      });
    }
    render(true); startTimer();
  }).catch(() => { render(true); });

  // Browsers commonly block autoplay with sound. Try it, then offer a real play button.
  const updateAudioState = () => {
    const playing = !audio.paused;
    musicLabel.textContent = playing ? 'Pause music' : 'Play music';
    musicIcon.textContent = playing ? 'Ⅱ' : '▶';
    musicButton.setAttribute('aria-label', playing ? "Pause Chico's music" : "Play Chico's music");
    musicHint.textContent = playing ? 'Playing on repeat' : 'Tap to play Chico’s music';
  };
  musicButton.addEventListener('click', async () => {
    if (audio.paused) {
      try { await audio.play(); } catch (_) { musicHint.textContent = 'Unable to play audio on this device.'; }
    } else { audio.pause(); }
    updateAudioState();
  });
  audio.addEventListener('play', updateAudioState);
  audio.addEventListener('pause', updateAudioState);
  audio.addEventListener('error', () => { musicHint.textContent = 'Music is unavailable right now.'; });
  audio.volume = 0.65;
  const attemptAutoplay = audio.play();
  if (attemptAutoplay && typeof attemptAutoplay.catch === 'function') {
    attemptAutoplay.catch(() => { updateAudioState(); });
  }
  updateAudioState();
})();

  </script>
</body>
</html>
